name: collect

on:
  schedule:
    # 매일 KST 06:00 (UTC 21:00)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 분석할 최대 영상 수"
        required: false
        default: ""
      no_llm_filter:
        description: "LLM 사전 필터 건너뛰기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: techletter-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and analyze new videos
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -m src.run_collect \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.no_llm_filter && '--no-llm-filter' || '' }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(data): collect $(date -u +%Y-%m-%d)"
          git push
