name: diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install youtube-transcript-api yt-dlp
      - name: Probe transcript access from this runner
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/diagnose_youtube_access.py
