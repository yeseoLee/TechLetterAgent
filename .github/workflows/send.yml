name: send

on:
  schedule:
    # 매주 월요일 KST 07:00 (일요일 UTC 22:00)
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송 없이 추천 결과만 출력 (Gmail 설정 불필요)"
        type: boolean
        default: false
      feedback_only:
        description: "답장만 읽어 프로필에 반영 (발송 없음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: techletter-state
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read replies, recommend, and send newsletter
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FEEDBACK_ADDRESS: ${{ secrets.FEEDBACK_ADDRESS }}
        run: |
          python -m src.run_send \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.feedback_only && '--feedback-only' || '' }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(data): send $(date -u +%Y-%m-%d)"
          git push
